<script>
setTimeout(function() {
  var files = [
    ['config.js', typeof SUPABASE_URL !== 'undefined'],
    ['icons.js', typeof ICONS !== 'undefined'],
    ['supabase.js', typeof initSupabase !== 'undefined'],
    ['guest.js', typeof Guest !== 'undefined'],
    ['auth.js', typeof Auth !== 'undefined'],
    ['exams.js', typeof Exams !== 'undefined'],
    ['shop.js', typeof Shop !== 'undefined'],
    ['ai.js', typeof AI !== 'undefined'],
    ['ai-eval.js', typeof AIEval !== 'undefined'],
    ['qrcode.js', typeof QRCode !== 'undefined'],
    ['certificate.js', typeof Certificate !== 'undefined'],

    ['leaderboard.js', typeof Leaderboard !== 'undefined'],
    ['notifications.js', typeof Notifications !== 'undefined'],
    ['admin-shop.js', typeof AdminShop !== 'undefined'],

    ['saved-papers.js', typeof SavedPapers !== 'undefined'],
    ['daily-challenge.js', typeof DailyChallenge !== 'undefined'],

    ['exam-room.js', typeof ExamRoom !== 'undefined'],
    ['result.js', typeof Result !== 'undefined'],
    ['app.js', typeof startApp !== 'undefined'],

  var html = '';
  files.forEach(function(f) {
    html += f[0] + ': ' + (f[1] ? '✅ OK' : '❌ FAILED') + '<br>';

  document.getElementById('results').innerHTML = html;
